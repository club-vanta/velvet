name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, lint, format, build, unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit

  # The Cypress suites run in parallel jobs: SPLIT is the number of jobs and
  # SPLIT_INDEX1 this job's number. cypress-split (cypress.config.ts) cuts the
  # specs by the durations in cypress/timings, so the jobs end close together.
  e2e:
    name: Cypress E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Instrument the app so the suite reports code coverage.
      VITE_COVERAGE: "true"
      SPLIT: 3
      SPLIT_INDEX1: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Stubbed E2E suite: the app is built in "e2e" mode, so it talks to a
      # host that does not exist and every API call is a cy.intercept stub.
      # A served build loads much faster than the dev server on every visit.
      - name: E2E tests
        uses: cypress-io/github-action@v7
        with:
          start: npm run serve:e2e
          wait-on: "http://localhost:5200"
          wait-on-timeout: 300
          browser: chrome

      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-e2e-${{ matrix.shard }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cypress-e2e-${{ matrix.shard }}
          path: coverage/cypress/coverage-final.json
          if-no-files-found: ignore

  component:
    name: Cypress component (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      VITE_COVERAGE: "true"
      SPLIT: 2
      SPLIT_INDEX1: ${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Component tests
        uses: cypress-io/github-action@v7
        with:
          component: true
          browser: chrome

      - name: Upload screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-component-${{ matrix.shard }}
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cypress-component-${{ matrix.shard }}
          path: coverage/cypress/coverage-final.json
          if-no-files-found: ignore

  # Each Cypress job covers part of the app; this merges their coverage into
  # the one report the single job used to upload.
  cypress-coverage:
    name: Cypress coverage report
    needs: [e2e, component]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-cypress-*
          path: shards

      - name: Merge coverage
        run: |
          mkdir -p .nyc_output
          for shard in shards/*/; do
            cp "$shard/coverage-final.json" ".nyc_output/$(basename "$shard").json"
          done
          # Reads every file in .nyc_output; report-dir and reporters from .nycrc.
          npx nyc report

      - name: Upload Cypress coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cypress
          path: coverage/cypress
          if-no-files-found: ignore

  smoke:
    name: Cypress smoke (real backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alter_event_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/alter_event_tracker
      JWT_SIGNING_KEY: ci-signing-key-not-used-in-production
      # Only for the throwaway accounts that scripts/seed_e2e.py creates.
      E2E_PASSWORD: ci-smoke-password-not-a-secret
      # Chrome, like the other Cypress jobs (package.json reads VELVET_BROWSER).
      VELVET_BROWSER: chrome

    # Side by side, as on a developer machine: cypress.config.ts finds the
    # backend at ../alter-tracker-backend.
    defaults:
      run:
        working-directory: velvet

    steps:
      - uses: actions/checkout@v4
        with:
          path: velvet

      # Test against the backend branch with the same name when there is one,
      # so a change that spans both repos runs together; otherwise main.
      - name: Pick the backend branch
        id: backend
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/club-vanta/alter-tracker-backend "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: club-vanta/alter-tracker-backend
          ref: ${{ steps.backend.outputs.ref }}
          path: alter-tracker-backend

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: alter-tracker-backend/uv.lock

      - name: Start the backend
        working-directory: alter-tracker-backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          # Run uvicorn from the venv, not through uv run: a uv process left
          # running holds the uv cache lock, and setup-uv prunes the cache when
          # the job ends.
          nohup .venv/bin/uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: velvet/package-lock.json

      # test:smoke starts the dev server in "smoke" mode against localhost:8000
      # and seeds the backend before each test (cypress.config.ts, db:seed).
      - name: Smoke tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: velvet
          wait-on: "http://localhost:8000/docs"
          command: npm run test:smoke

      - name: Upload the backend log and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-debug
          path: |
            ${{ runner.temp }}/backend.log
            velvet/cypress/screenshots
          if-no-files-found: ignore
